<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Check-In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #fff; padding: 40px 36px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); max-width: 420px; width: 100%; border: 1px solid #e9edf4; text-align: center; }
        .card h1 { font-size: 26px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .card .subtitle { font-size: 15px; color: #64748b; margin-bottom: 28px; }
        .input-group { text-align: center; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; color: #334155; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; background: #fafcff; transition: 0.2s; }
        .input-group input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.08); }
        .btn-checkin { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: #1e293b; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-checkin:hover { background: #0f172a; }
        .btn-checkin:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; text-align: left; }
        .status.success { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .status.loading { display: block; background: #fffbeb; color: #854d0e; border: 1px solid #fde68a; }
        .subject-badge { display: inline-block; margin-bottom: 20px; padding: 6px 14px; background: #eef2ff; color: #3730a3; border-radius: 100px; font-size: 13px; font-weight: 500; border: 1px solid #c7d2fe; }
        .subject-badge.none { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
        .footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid #e9edf4; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; }
        .footer a { color: #94a3b8; text-decoration: none; margin-left: 16px; }
        @media (max-width: 480px) { .card { padding: 28px 20px; } .card h1 { font-size: 22px; } .footer { flex-direction: column; align-items: flex-start; gap: 6px; } }
    </style>
</head>
<body>

    <div class="card">
        <h1>Check In</h1>
        <p class="subtitle">Enter your student ID to verify your location</p>

        <div id="subjectBadge" class="subject-badge none">Checking current class...</div>

        <div class="input-group">
            <label for="studentID">Student ID</label>
            <input type="text" id="studentID" placeholder="e.g. 2023-1001" autocomplete="off" />
        </div>

        <button class="btn-checkin" id="checkinBtn">Verify Location</button>

        <div class="status" id="statusMessage"></div>

        <div class="footer">
            <span>Where U &bull; 2026</span>
            <div><a href="help.html">Help</a><a href="privacy.html">Privacy</a></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="geofence.js"></script>

    <script>
        // ===== FINGERPRINT DEVICE ID (Stops Incognito bypass) =====
        function getDeviceID() {
            let deviceID = localStorage.getItem('whereU_deviceID');
            if (!deviceID) {
                const fingerprint = navigator.userAgent + screen.width + 'x' + screen.height + navigator.language + new Date().getTimezoneOffset();
                let hash = 0;
                for (let i = 0; i < fingerprint.length; i++) {
                    hash = ((hash << 5) - hash) + fingerprint.charCodeAt(i);
                    hash |= 0;
                }
                deviceID = 'dev-' + Math.abs(hash);
                localStorage.setItem('whereU_deviceID', deviceID);
            }
            return deviceID;
        }

        const studentIDInput = document.getElementById('studentID');
        const checkinBtn = document.getElementById('checkinBtn');
        const statusDiv = document.getElementById('statusMessage');
        const subjectBadge = document.getElementById('subjectBadge');

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function getActiveSubject(subjects) {
            const now = new Date();
            const currentTime = now.getHours() * 60 + now.getMinutes();

            for (const subjectID in subjects) {
                const subject = subjects[subjectID];
                if (!subject.start || !subject.end) continue;

                const [startH, startM] = subject.start.split(':').map(Number);
                const [endH, endM] = subject.end.split(':').map(Number);

                const startTime = startH * 60 + startM;
                const endTime = endH * 60 + endM;

                if (currentTime >= startTime && currentTime <= endTime) {
                    return { id: subjectID, name: subject.name };
                }
            }
            return null;
        }

        function refreshSubjectBadge() {
            database.ref('subjects').once('value').then((snapshot) => {
                const subjects = snapshot.val() || {};
                const active = getActiveSubject(subjects);

                if (active) {
                    subjectBadge.textContent = 'Current class: ' + active.name;
                    subjectBadge.className = 'subject-badge';
                } else {
                    subjectBadge.textContent = 'No class in session';
                    subjectBadge.className = 'subject-badge none';
                }
            }).catch(() => {
                subjectBadge.textContent = 'Unable to load schedule';
                subjectBadge.className = 'subject-badge none';
            });
        }

        function handleLocation(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const studentID = studentIDInput.value.trim();

            Promise.all([
                database.ref('students/' + studentID).once('value'),
                database.ref('subjects').once('value'),
                database.ref('active_session').once('value') // Get Teacher Location
            ]).then(([studentSnap, subjectsSnap, sessionSnap]) => {
                
                // 1. Verify Student ID
                if (!studentSnap.exists()) {
                    showStatus('❌ Student ID not found.', 'error');
                    checkinBtn.disabled = false;
                    checkinBtn.textContent = 'Verify Location';
                    return;
                }

                const studentData = studentSnap.val();
                const studentName = studentData.name || 'Unknown';
                const subjects = subjectsSnap.val() || {};
                const activeSubject = getActiveSubject(subjects);
                const session = sessionSnap.val();

                // 2. Verify Active Subject
                if (!activeSubject) {
                    showStatus('❌ No class is currently in session.', 'error');
                    checkinBtn.disabled = false;
                    checkinBtn.textContent = 'Verify Location';
                    return;
                }

                // 3. Verify Teacher Session is Active
                if (!session || session.status !== 'active') {
                    showStatus('❌ Teacher has not started the classroom session.', 'error');
                    checkinBtn.disabled = false;
                    checkinBtn.textContent = 'Verify Location';
                    return;
                }

                const now = new Date();
                const today = now.toISOString().split('T')[0];
                const deviceID = getDeviceID();

                // 4. Device Binding Check
                Promise.all([
                    database.ref('student_devices/' + studentID).once('value'),
                    database.ref('device_links/' + deviceID).once('value')
                ]).then(([studentDeviceSnap, deviceLinkSnap]) => {
                    const linkedDevice = studentDeviceSnap.val();
                    const linkedStudent = deviceLinkSnap.val();

                    if (linkedDevice && linkedDevice !== deviceID) {
                        showStatus('❌ This student is already linked to another phone.', 'error');
                        checkinBtn.disabled = false;
                        checkinBtn.textContent = 'Verify Location';
                        return;
                    }

                    if (linkedStudent && linkedStudent !== studentID) {
                        showStatus('❌ This phone is already linked to another student.', 'error');
                        checkinBtn.disabled = false;
                        checkinBtn.textContent = 'Verify Location';
                        return;
                    }

                    if (!linkedDevice) database.ref('student_devices/' + studentID).set(deviceID);
                    if (!linkedStudent) database.ref('device_links/' + deviceID).set(studentID);

                    // 5. Anti-Spoofing Check (Haversine)
                    database.ref('attendance/' + activeSubject.id + '/' + studentID).once('value').then((prevSnap) => {
                        const previousRecord = prevSnap.val();
                        const spoofCheck = checkGPSSpoofing(lat, lng, position.coords.accuracy, previousRecord);

                        if (spoofCheck.suspicious) {
                            database.ref('attendance/' + activeSubject.id + '/' + studentID).set({
                                studentID: studentID, name: studentName, subject: activeSubject.name,
                                latitude: lat, longitude: lng, status: 'Rejected - GPS Spoofing Detected',
                                spoofReason: spoofCheck.reason, date: today, timestamp: now.toISOString()
                            });
                            showStatus('❌ GPS spoofing detected: ' + spoofCheck.reason, 'error');
                            checkinBtn.disabled = false;
                            return;
                        }

                        // 6. Classroom Geofence Check (Are they within 30m of the teacher?)
                        const distanceToTeacher = haversineDistance(session.teacherLat, session.teacherLng, lat, lng);
                        const insideClassroom = distanceToTeacher <= 30; // CHANGED TO 30 METERS

                        // DEBUGGING ALERT
                        alert("Distance: " + distanceToTeacher.toFixed(2) + " meters.");

                        const status = insideClassroom ? 'Present' : 'Rejected - Outside Classroom';

                        database.ref('attendance/' + activeSubject.id + '/' + studentID).set({
                            studentID: studentID, name: studentName, subject: activeSubject.name,
                            latitude: lat, longitude: lng, status: status,
                            accuracy: position.coords.accuracy || null, date: today, timestamp: now.toISOString()
                        }).then(function() {
                            if (insideClassroom) {
                                showStatus('✅ ' + studentName + ', you are marked Present for ' + activeSubject.name + '.', 'success');
                                checkinBtn.textContent = '✓ Verified';
                            } else {
                                showStatus('❌ You are too far from the teacher. Check in inside the classroom.', 'error');
                                checkinBtn.textContent = 'Try Again';
                            }
                        }).catch(function(error) {
                            showStatus('Error: ' + error.message, 'error');
                        }).finally(function() {
                            checkinBtn.disabled = false;
                        });
                    });
                });
            }).catch(function(error) {
                showStatus('Database error: ' + error.message, 'error');
                checkinBtn.disabled = false;
                checkinBtn.textContent = 'Verify Location';
            });
        }

        function checkIn() {
            const studentID = studentIDInput.value.trim();
            if (!studentID) { showStatus('Please enter your student ID.', 'error'); return; }
            if (!navigator.geolocation) { showStatus('GPS is not available.', 'error'); return; }

            checkinBtn.disabled = true;
            checkinBtn.textContent = 'Verifying...';
            showStatus('Getting your location...', 'loading');

            navigator.geolocation.getCurrentPosition(
                function(position) { handleLocation(position); },
                function() {
                    showStatus('Getting precise location...', 'loading');
                    navigator.geolocation.getCurrentPosition(
                        function(position) { handleLocation(position); },
                        function(error) {
                            let msg = 'GPS failed: ';
                            if (error.code === 1) msg += 'Permission denied.';
                            else if (error.code === 2) msg += 'Signal unavailable.';
                            else if (error.code === 3) msg += 'Request timed out.';
                            else msg += error.message;
                            showStatus(msg, 'error');
                            checkinBtn.disabled = false;
                            checkinBtn.textContent = 'Verify Location';
                        },
                        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
                    );
                },
                { enableHighAccuracy: false, timeout: 5000, maximumAge: 0 }
            );
        }

        checkinBtn.addEventListener('click', checkIn);
        studentIDInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); checkIn(); }
        });
        
        window.addEventListener('load', function() {
            studentIDInput.focus();
            refreshSubjectBadge();
        });
        
        setInterval(refreshSubjectBadge, 30000);
    </script>
</body>
</html>
