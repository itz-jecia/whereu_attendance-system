<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; padding: 32px 24px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .header-left h1 { font-size: 28px; font-weight: 600; color: #0f172a; }
        .header-left p { color: #64748b; font-size: 15px; margin-top: 4px; }
        
        .control-panel { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .beacon-box { flex: 1; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 15px 20px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-weight: 500; min-width: 300px; }
        .pulse-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .remote-box { flex: 1; background: #fff; border: 1px solid #e2e8f0; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .remote-btn { background: #1e293b; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .remote-btn:hover { background: #0f172a; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #fff; padding: 20px 24px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .stat-label { font-size: 13px; font-weight: 500; color: #94a3b8; text-transform: uppercase; }
        .stat-number { font-size: 32px; font-weight: 600; color: #0f172a; margin-top: 4px; }
        .stat-number.present { color: #16a34a; } .stat-number.rejected { color: #dc2626; } .stat-number.absent { color: #94a3b8; }
        
        .table-wrapper { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        th { text-align: left; padding: 14px; font-weight: 600; font-size: 12px; text-transform: uppercase; color: #64748b; white-space: nowrap; }
        th.subject-col { text-align: center; background: #f1f5f9; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; color: #0f172a; }
        td.subject-col { text-align: center; }
        tr:hover td { background: #fafcff; }
        .status-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 600; }
        .status-present { background: #dcfce7; color: #166534; } .status-rejected { background: #fee2e2; color: #991b1b; } .status-absent { background: #f1f5f9; color: #94a3b8; }
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>Attendance Records</h1>
            <p>Real-time view of student check-ins</p>
        </div>
    </div>

    <div class="control-panel">
        <!-- Automatic Beacon -->
        <div class="beacon-box">
            <div class="pulse-dot"></div>
            <span id="beaconText">Starting classroom GPS beacon...</span>
        </div>

        <!-- Remote Activity Mode -->
        <div class="remote-box">
            <div>
                <strong>Remote Activity Mode:</strong> 
                <select id="roomSelect" style="padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1; margin-left: 5px;">
                    <option value="main_room">Main Classroom (7.704583, 125.996222)</option>
                </select>
            </div>
            <button id="startRemoteSessionBtn" class="remote-btn">Start Remote Activity</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Students</div><div class="stat-number" id="totalCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Total Present</div><div class="stat-number present" id="presentCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Total Rejected</div><div class="stat-number rejected" id="rejectedCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Not Checked In</div><div class="stat-number absent" id="absentCount">0</div></div>
    </div>

    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead id="tableHead">
                    <tr><th>Loading...</th></tr>
                </thead>
                <tbody id="attendanceBody">
                    <tr><td colspan="10" class="empty-state">Loading attendance data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="geofence.js"></script>

<script>
    // ===== 1. AUTOMATIC GPS BEACON =====
    function broadcastClassroomLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    database.ref('active_session').set({
                        teacherLat: position.coords.latitude,
                        teacherLng: position.coords.longitude,
                        status: 'active',
                        mode: 'live',
                        timestamp: new Date().toISOString()
                    });
                    document.getElementById('beaconText').textContent = "Live Beacon ACTIVE. Students must be within 10 meters of this device.";
                    document.getElementById('beaconText').style.color = "#166534";
                },
                function(error) {
                    document.getElementById('beaconText').textContent = "WARNING: GPS failed. Please allow location access.";
                    document.getElementById('beaconText').style.color = "#dc2626";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    // ===== 2. REMOTE ACTIVITY MODE =====
    document.getElementById('startRemoteSessionBtn').addEventListener('click', function() {
        // The exact coordinates of the classroom provided
        const roomLat = 7.704583;
        const roomLng = 125.996222;

        database.ref('active_session').set({
            teacherLat: roomLat,
            teacherLng: roomLng,
            status: 'active',
            mode: 'remote',
            timestamp: new Date().toISOString()
        });

        document.getElementById('beaconText').textContent = "REMOTE SESSION ACTIVE: Students must be inside the Main Classroom.";
        document.getElementById('beaconText').style.color = "#2563eb";
        alert("Remote activity started. Students can now check in to the Main Classroom.");
    });

    // Start beacon on load, then update every 30 seconds
    window.addEventListener('load', function() {
        broadcastClassroomLocation();
        setInterval(broadcastClassroomLocation, 30000);
        loadData();
        setInterval(loadData, 10000);
    });

    // ===== 3. LOAD ATTENDANCE DATA =====
    function loadData() {
        const tbody = document.getElementById('attendanceBody');
        const thead = document.getElementById('tableHead');

        Promise.all([
            database.ref('students').once('value'),
            database.ref('subjects').once('value'),
            database.ref('attendance').once('value')
        ]).then(([studentsSnap, subjectsSnap, attendanceSnap]) => {
            const students = studentsSnap.val() || {};
            const subjects = subjectsSnap.val() || {};
            const attendance = attendanceSnap.val() || {};

            const subjectIDs = Object.keys(subjects);
            const today = new Date().toISOString().split('T')[0];

            // Header
            let headerHTML = `<tr><th>Student ID</th><th>Name</th>`;
            subjectIDs.forEach((subjectID) => {
                headerHTML += `<th class="subject-col">${subjects[subjectID].name || subjectID}</th>`;
            });
            headerHTML += `</tr>`;
            thead.innerHTML = headerHTML;

            // Rows
            const studentIDs = Object.keys(students);
            let present = 0, rejected = 0, absent = 0, html = '';

            studentIDs.forEach((studentID) => {
                const studentInfo = students[studentID] || {};
                html += `<tr><td><strong>${studentID}</strong></td><td>${studentInfo.name || '—'}</td>`;

                subjectIDs.forEach((subjectID) => {
                    let record = (attendance[subjectID] || {})[studentID] || null;
                    if (record && record.date && record.date !== today) record = null;

                    if (record) {
                        const status = record.status || 'Unknown';
                        const isPresent = status.includes('Present');
                        if (isPresent) present++; else rejected++;
                        
                        const iconClass = isPresent ? 'status-present' : 'status-rejected';
                        const icon = isPresent ? '✓' : '✕';
                        const tooltip = isPresent ? 'Present' : status;

                        html += `<td class="subject-col"><span class="status-icon ${iconClass}" title="${tooltip}">${icon}</span></td>`;
                    } else {
                        absent++;
                        html += `<td class="subject-col"><span class="status-icon status-absent" title="Not Checked In">—</span></td>`;
                    }
                });
                html += `</tr>`;
            });

            tbody.innerHTML = html || `<tr><td colspan="${subjectIDs.length + 2}" class="empty-state"><p>No students found.</p></td></tr>`;
            updateStats(studentIDs.length, present, rejected, absent);

        }).catch((error) => {
            console.error('Error:', error);
            tbody.innerHTML = `<tr><td colspan="10" class="empty-state"><p style="color:#dc2626;">Error loading data.</p></td></tr>`;
        });
    }

    function updateStats(total, present, rejected, absent) {
        document.getElementById('totalCount').textContent = total;
        document.getElementById('presentCount').textContent = present;
        document.getElementById('rejectedCount').textContent = rejected;
        document.getElementById('absentCount').textContent = absent;
    }
</script>
</body>
</html>
